<body>
    <header>
        <nav class="nav_box">
            <ul>
                <li><a href="index.html">Inici</a></li>
                <li><a href="fitxa.html">Fitxa esdeveniment</a></li>
                <li><a href="contacte.html">Contacte</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="lista_esdeveniments">
            <h1>Contactar amb el creador de la pagina </h1>
        </section>
        <section class="contacto">
            <form class="form_contacto">
                <label for="fname">Nombre:</label>
                <input type="text" name="fname" required><br><br>
                <label for="lname">Apellidos:</label>
                <input type="text" name="lname" required><br><br>

                <label for="correo">Ingrese su correo electronico:</label>
                <input type="email" name="correo" placeholder="example@gmail.com" required> <br><br>

                <label for="comentario">Ingrese lo que quiere decir:</label><br>
                <textarea name="comentario" rows="5" cols="40" placeholder="Del evento 1..."></textarea><br><br>
                <label for="telcontacto">Ingre su telefono de contacto (opcional):</label>
                <input type="tel" name="telcontacto" placeholder="111-11-11-11" pattern="[0-9]{3}-[0-9]{2}-[0-9]{2}-[0-9]{2}"> <br><br>
                <input type="submit" value="Enviar formulario">
                <input type="reset" value="Vacia formulario">
                

            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
